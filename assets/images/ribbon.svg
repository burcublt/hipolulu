  <!-- broad inner shine -->
  <path d="
    M 276 251
    C 420 176 685 126 1024 126
    C 1363 126 1628 176 1772 251"
    stroke="#E59AFF"
    stroke-width="9"
    stroke-linecap="round"
    opacity=".32"/>

  <!-- lower curved dark edge -->
  <path d="
