    stroke-width="10"
    stroke-linejoin="round"
    filter="url(#smallShadow)"/>

  <!-- RIGHT tail highlight -->
  <path d="
    M 1983 390
    C 1908 355 1833 335 1756 324
    C 1691 315 1630 329 1582 355"
