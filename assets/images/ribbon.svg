<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 2048 768"
     width="2048" height="768"
     fill="none">

  <defs>
    <!-- Main purple ribbon -->
    <linearGradient id="ribbonBody" x1="1024" y1="82" x2="1024" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C85BFF"/>
      <stop offset="0.34" stop-color="#A83CF2"/>
      <stop offset="0.72" stop-color="#8124E3"/>
      <stop offset="1" stop-color="#6517C5"/>
    </linearGradient>

    <linearGradient id="tailGradient" x1="90" y1="350" x2="500" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A846EE"/>
      <stop offset="0.55" stop-color="#8A2DE2"/>
      <stop offset="1" stop-color="#6517C3"/>
    </linearGradient>

    <linearGradient id="tailDark" x1="250" y1="440" x2="470" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A12A9"/>
      <stop offset="1" stop-color="#7C21D1"/>
    </linearGradient>

    <linearGradient id="topGlow" x1="1024" y1="92" x2="1024" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4C7FF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#D878FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bottomShade" x1="1024" y1="365" x2="1024" y2="525" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6A17C6" stop-opacity=".15"/>
      <stop offset="1" stop-color="#3E087E" stop-opacity=".82"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="13"
                    flood-color="#35106B" flood-opacity=".42"/>
    </filter>

    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8"
                    flood-color="#3A0A72" flood-opacity=".42"/>
    </filter>
  </defs>

  <!-- LEFT TAIL -->
  <path d="
    M 286 312
    C 220 322 136 345 61 379
    C 42 388 38 403 54 416
    L 184 492
    L 92 632
    C 84 644 91 663 106 665
    C 184 653 276 630 354 603
    C 416 581 468 566 506 558
    L 482 405
    Z"
    fill="url(#tailGradient)"
    stroke="#6816C9"
    stroke-width="10"
    stroke-linejoin="round"
    filter="url(#smallShadow)"/>

  <!-- LEFT tail highlight -->
  <path d="
    M 65 390
    C 140 355 215 335 292 324
    C 357 315 418 329 466 355"
    stroke="#E6B1FF"
    stroke-width="12"
    stroke-linecap="round"
    opacity=".62"/>

  <!-- LEFT tail fold -->
  <path d="
    M 279 382
